name: Daily watchlist and GitHub Pages
on:
  schedule:
    - cron: '40 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['state/**', 'README.md']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: runtime
          key: market-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-data-
      - run: pip install -r requirements.txt
      - name: Update missing daily bars for ALL selected stocks
        run: python publish_data.py --refresh
      - name: Save downloaded bars even if some symbols failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime
          key: market-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-download-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/download_report.json
            state/chart_errors.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Check published data
        run: python verify_data.py
      - name: Persist candidate history
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily candidate history'
            # Queued runs can outlive their triggering commit. Never force-push.
            for attempt in 1 2 3; do
              git fetch origin "$TARGET_BRANCH"
              git rebase --autostash "origin/$TARGET_BRANCH"
              if git push origin "HEAD:$TARGET_BRANCH"; then
                exit 0
              fi
            done
            echo 'History could not be saved after three attempts; leaving the current website unchanged.' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - name: Deploy shared snapshot
        id: deploy
        uses: actions/deploy-pages@v4
